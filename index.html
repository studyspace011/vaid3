<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VAID – Notes Request</title><meta name="theme-color" content="#3a1f0a">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4efe6;--card:#fff;--ink:#2b1b0e;--mute:#7a6a58;--line:#e6dccb;--gold:#e8a920;--amber:#b86e00;--brown:#3a1f0a;--soft:#f1e8d8}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 Inter,system-ui,sans-serif}
.mu{color:var(--mute);font-size:13.5px}
#splash{position:fixed;inset:0;background:var(--brown);color:#fde7ad;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:9;transition:opacity .5s}
#splash.out{opacity:0;pointer-events:none}
.ck{width:96px;height:96px}.ck circle{fill:none;stroke:var(--gold);stroke-width:4;stroke-dasharray:252;stroke-dashoffset:252;animation:d .9s ease forwards}
.ck path{fill:none;stroke:#fde7ad;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:d .5s .8s ease forwards}
@keyframes d{to{stroke-dashoffset:0}}@keyframes f{to{opacity:1}}
#splash h1{font:700 32px 'Playfair Display',Georgia,serif;margin:18px 0 6px;opacity:0;animation:f .5s 1.3s forwards}
#splash p{margin:4px 0;opacity:0;animation:f .5s 1.8s forwards}
#splash .s{color:var(--gold);font-weight:600}
#go{margin-top:26px;opacity:0;animation:f .5s 2.4s forwards}
main{max-width:520px;margin:auto;padding:16px 16px 40px}
header{display:flex;align-items:baseline;gap:10px;padding:6px 0 14px}header b{font:700 24px 'Playfair Display',serif;color:var(--brown)}
.bar{height:6px;background:var(--soft);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;width:10%;background:linear-gradient(90deg,var(--gold),var(--amber));transition:width .4s}
#cr{margin:12px 0 0;color:var(--mute);font-size:13px;min-height:20px}
h2{font:700 25px/1.25 'Playfair Display',serif;color:var(--brown);margin:6px 0 14px}
.opt{display:flex;width:100%;justify-content:space-between;align-items:center;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 9px;font:inherit;color:inherit;cursor:pointer;min-height:52px}
.opt:active{transform:scale(.98);background:var(--soft)}.opt small{display:block;color:var(--mute);font-size:12.5px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.grid .opt{justify-content:center;margin:0;font-weight:600;padding:14px 0}
.btn{background:var(--brown);color:#fff8e8;border:0;border-radius:24px;padding:13px 26px;font:600 15px Inter,sans-serif;cursor:pointer;min-height:48px}
.btn.alt{background:transparent;color:var(--brown);border:1px solid var(--line)}.btn:disabled{opacity:.6}
.link{background:none;border:0;color:var(--amber);font:inherit;text-decoration:underline;cursor:pointer;padding:8px 0}
label{display:block;font-weight:600;font-size:13.5px;margin:0 0 12px}
input{display:block;width:100%;margin-top:5px;padding:13px;border:1px solid var(--line);border-radius:10px;font:16px Inter,sans-serif;background:#fff;color:var(--ink)}
input:focus,.btn:focus-visible,.opt:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
.hp{position:absolute;left:-9999px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;text-align:center}
.id{font:700 28px 'Playfair Display',serif;color:var(--amber);margin:6px 0}
#md{position:fixed;inset:0;background:rgba(58,31,10,.55);display:none;align-items:center;justify-content:center;padding:20px;z-index:8}#md.on{display:flex}
.box{background:#fff;border-radius:16px;padding:22px;max-width:380px;width:100%}.box h3{font:700 20px 'Playfair Display',serif;margin:0 0 8px;color:var(--brown)}.row{display:flex;gap:8px;flex-wrap:wrap}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important;transition:none!important}}
</style></head><body>
<div id="splash">
<svg class="ck" viewBox="0 0 96 96"><circle cx="48" cy="48" r="40"/><path d="M30 50l13 13 23-27"/></svg>
<h1>Congrats! 🎉</h1><p>You're one step away from your notes.</p><p class="s">Just give us 30 seconds.</p>
<button class="btn" id="go" style="background:var(--gold);color:var(--brown)">Get started</button>
</div>
<main>
<header><b>VAID</b><span class="mu">Notes request</span></header>
<div class="bar"><i id="pb"></i></div><div id="cr"></div>
<h2 id="q">Loading...</h2><div id="o"></div>
<button class="link" id="bk" hidden>← Back</button>
<p class="mu" style="margin-top:22px"><button class="link" id="st">Check request status</button> · <a class="link" href="https://wa.me/917979016680" target="_blank" rel="noopener">Need help? WhatsApp</a></p>
</main><div id="md"></div>
<script>
/* ===== SETTINGS: edit this line only ===== */
const CFG={api:"https://script.google.com/macros/s/AKfycbzI8cs56x4eVA_0KVn-c-gFtQa4Jd9rGqx5mgMAjePp15KSCkGCqGBbhSlYsRjnV_ZSdw/exec",gid:"",vaid:"https://studyspace011.github.io/vaid/"};
/* api = your Apps Script Web App URL. gid = Google OAuth Client ID (optional, one-tap email). vaid = your notes site (data/*.json) */

const $=id=>document.getElementById(id),esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const NAMES={ba:"B.A.",bsc:"B.Sc.",bcom:"B.Com."};
const TYPES={MJC:["Major (MJC)","Your main subject"],MIC:["Minor (MIC)","Your secondary subject"],MDC:["MDC","Multidisciplinary course"],OTH:["Other","AEC, SEC, VAC"]};
const STEPS=["sem","st","ty","dept","p","f"];
const E={keyword:["Keyword doesn't match","Enter the exact keyword given at the end of the notes. Read the notes once more and try again."],dup:["Request already registered","You already have a pending request for this paper. We'll email you when new notes are added."],avail:["Already available","All notes for this paper are already available on VAID."],limit:["Daily limit reached","Only a few requests are allowed per day. Please come back tomorrow."],email:["Email not valid","Please check your email and try again."],name:["Name required","Please enter your full name."],busy:["Server is busy","Please try again in a moment."],server:["Something went wrong","Please try again. If it keeps failing, message us on WhatsApp."]};
let DATA={},AV={},S={},H=[];
const tap=()=>navigator.vibrate&&navigator.vibrate(12);

function modal(t,m,b){const x=b||[["OK"]];$("md").innerHTML=`<div class="box"><h3>${esc(t)}</h3><p class="mu" style="margin:0 0 16px">${m}</p><div class="row">${x.map((y,i)=>`<button class="btn ${i?"alt":""}" data-i="${i}">${esc(y[0])}</button>`).join("")}</div></div>`;$("md").classList.add("on");
$("md").onclick=e=>{const k=e.target.closest("[data-i]");if(e.target.id=="md"||k){$("md").classList.remove("on");if(k&&x[+k.dataset.i][1])x[+k.dataset.i][1]()}}}

async function load(k){if(DATA[k])return;const r=await fetch(CFG.vaid+"data/"+k+".json",{cache:"no-cache"});if(!r.ok)throw 0;const j=await r.json();
DATA[k]=(Array.isArray(j)?j:j.papers).map((p,i)=>({...p,id:String(p.id??k+"-"+i),sem:+p.sem,type:String(p.type||"").trim().toUpperCase(),dept:String(p.dept||"").trim()||"Common",name:String(p.name||p.title||"Untitled")}))}

const types=()=>["MJC","MIC","MDC"].filter(t=>DATA[S.st].some(p=>p.sem==S.sem&&p.type==t)).concat(DATA.common.some(p=>p.sem==S.sem)?["OTH"]:[]);
const depts=()=>[...new Set(DATA[S.st].filter(p=>p.sem==S.sem&&p.type==S.ty).map(p=>p.dept))].sort();
const plist=()=>S.ty=="OTH"?DATA.common.filter(p=>p.sem==S.sem):DATA[S.st].filter(p=>p.sem==S.sem&&p.type==S.ty&&p.dept==S.dept);
/* Auto-filter: any step with only one choice is skipped. Choosing a paper goes straight to the request form. */
function adv(){for(;;){
 if(!S.sem)return S.step="sem";
 if(!S.st)return S.step="st";
 if(!S.ty){const t=types();if(t.length==1){S.ty=t[0];continue}return S.step="ty"}
 if(!S.dept&&S.ty!="OTH"){const d=depts();if(d.length==1){S.dept=d[0];continue}return S.step="dept"}
 if(!S.p){const l=plist();if(l.length==1){S.p=l[0];continue}return S.step="p"}
 return S.step="f"}}

async function pick(k,v){tap();H.push({...S});
 try{if(k=="st")await load(v)}catch(e){S=H.pop();return fail()}
 if(k=="p")v=plist().find(x=>x.id==v);
 S[k]=k=="sem"?+v:v;adv();draw()}
function back(){S=H.pop();draw()}
function fail(){$("q").textContent="Could not load data";$("o").innerHTML='<p class="mu">Check your internet connection and try again.</p><button class="btn" onclick="start()">Retry</button>'}

function list(k,items){return items.map(i=>`<button class="opt" data-k="${k}" data-v="${esc(i[0])}"><span>${esc(i[1])}${i[2]?`<small>${esc(i[2])}</small>`:""}</span><span>›</span></button>`).join("")}
function draw(){const q=$("q"),o=$("o"),i=STEPS.indexOf(S.step);
 $("pb").style.width=Math.round((i+1.6)/(STEPS.length+.6)*100)+"%";$("bk").hidden=!H.length||S.step=="done";
 $("cr").textContent=[S.sem&&"Sem "+S.sem,S.st&&NAMES[S.st],S.ty&&TYPES[S.ty][0].split(" ")[0],S.dept,S.p&&S.p.code].filter(Boolean).join(" › ");
 if(S.step=="sem"){q.textContent="Which semester are you in?";o.innerHTML='<div class="grid">'+[1,2,3,4,5,6,7,8].map(n=>`<button class="opt" data-k="sem" data-v="${n}">${n}</button>`).join("")+"</div>"}
 else if(S.step=="st"){q.textContent="Which stream?";o.innerHTML=list("st",Object.keys(NAMES).map(k=>[k,NAMES[k]]))}
 else if(S.step=="ty"){q.textContent="What type of paper is this?";o.innerHTML=list("ty",types().map(t=>[t,TYPES[t][0],TYPES[t][1]]))}
 else if(S.step=="dept"){q.textContent="Which subject?";o.innerHTML=list("dept",depts().map(d=>[d,d]))}
 else if(S.step=="p"){q.textContent="Which paper?";o.innerHTML=list("p",plist().map(p=>[p.id,p.code+" – "+p.name,(p.cr||"")&&p.cr+" credits"]))}
 else if(S.step=="f")form();
 scrollTo(0,0)}

function form(){const a=AV[S.p.id];$("q").textContent=S.p.name;
 if(!a){$("o").innerHTML='<div class="card"><b>Coming soon</b><p class="mu">Notes for this paper are still being prepared. Please check back later.</p></div>';return}
 if(a.d>=a.t){$("o").innerHTML='<div class="card"><b>Already available</b><p class="mu">All notes for this paper are already on VAID.</p><button class="btn" onclick="open(CFG.vaid,\'_blank\')">Open VAID</button></div>';
  modal("Already available","All notes for <b>"+esc(S.p.name)+"</b> are already on VAID. Please check there first.",[["Open VAID",()=>open(CFG.vaid,"_blank")],["Go back",back]]);return}
 $("o").innerHTML=`<p class="mu">Request the remaining notes for this paper.</p>
<label>Your name<input id="nm" autocomplete="name" maxlength="60"></label>
<label>Keyword from the end of the notes<input id="kw" autocomplete="off"></label>
<label>Email<input id="em" type="email" autocomplete="email" placeholder="name@gmail.com"></label><div id="gb" style="margin:0 0 12px"></div>
<input id="hp" class="hp" tabindex="-1" autocomplete="off"><button class="btn" id="sub">Send request</button>
<p class="mu">Your email is used only to notify you when new notes are ready.</p>`;
 $("sub").onclick=()=>send();gsi()}
function gsi(){if(!CFG.gid)return;const run=()=>{google.accounts.id.initialize({client_id:CFG.gid,callback:r=>{S.tok=r.credential;try{const p=JSON.parse(decodeURIComponent(escape(atob(r.credential.split(".")[1].replace(/-/g,"+").replace(/_/g,"/")))));$("em").value=p.email;$("em").readOnly=true;if(!$("nm").value)$("nm").value=p.name||""}catch(e){}}});google.accounts.id.renderButton($("gb"),{theme:"outline",size:"large",text:"continue_with",width:280})};
 if(window.google&&google.accounts)run();else{const s=document.createElement("script");s.src="https://accounts.google.com/gsi/client";s.onload=run;document.head.appendChild(s)}}

async function send(skip){const nm=$("nm").value.trim(),kw=$("kw").value.trim();let em=$("em").value.trim().toLowerCase();
 if(nm.length<2||!kw||(!S.tok&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)))return modal("Form incomplete","Please fill in your name, the keyword and a valid email.");
 const fx=em.replace(/@(gmial|gmai|gamil|gnail)\.com$/,"@gmail.com").replace(/@gmail\.(con|cm|co)$/,"@gmail.com");
 if(!S.tok&&fx!=em&&!skip)return modal("Check your email","Is your email <b>"+esc(fx)+"</b>?",[["Yes, that's correct",()=>{$("em").value=fx;send(1)}],["No, I'll fix it"]]);
 let vr=[];try{vr=JSON.parse(localStorage.getItem("vr")||"[]").filter(t=>Date.now()-t<864e5)}catch(e){}
 if(vr.length>=3)return modal(...E.limit);
 $("sub").disabled=true;$("sub").textContent="Sending...";
 try{const r=await(await fetch(CFG.api,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({name:nm,email:em,idToken:S.tok||"",keyword:kw,paperId:S.p.id,hp:$("hp").value})})).json();
  if(r.ok){try{localStorage.setItem("vr",JSON.stringify([...vr,Date.now()]))}catch(e){}return done(r)}
  $("sub").disabled=false;$("sub").textContent="Send request";{const m=E[r.err]||E.server;modal(m[0],m[1]+(r.why?"<br><small>Details: "+esc(r.why)+"</small>":""))}}
 catch(e){$("sub").disabled=false;$("sub").textContent="Send request";modal("Network error","Please check your internet and try again.")}}

function done(r){S.step="done";H=[];$("bk").hidden=true;$("pb").style.width="100%";$("q").textContent="Request received!";
 $("o").innerHTML=`<div class="card"><p class="mu" style="margin:0">Your request ID</p><div class="id">${esc(r.id)}</div><p class="mu">${r.waiting>1?r.waiting+" students are waiting for this paper. ":""}We'll email you as soon as new notes are added. Save this ID.</p></div><p style="text-align:center"><button class="btn alt" onclick="reset()">New request</button></p>`}
function reset(){S={};H=[];adv();draw()}
function stat(){modal("Check request status","Enter your request ID.<input id='sid' placeholder='VAID-1001'>",[["Check",async()=>{try{const r=await(await fetch(CFG.api+"?action=status&id="+encodeURIComponent($("sid").value.trim()))).json();modal(r.ok?r.status:"Not found",r.ok?esc(r.paper):"This ID was not found.")}catch(e){modal("Network error","Please try again.")}}],["Close"]])}

async function start(){$("q").textContent="Loading...";$("o").innerHTML="";
 try{await load("common");AV=await(await fetch(CFG.api+"?action=avail")).json();adv();draw()}catch(e){fail()}}
$("o").onclick=e=>{const b=e.target.closest("[data-k]");if(b)pick(b.dataset.k,b.dataset.v)};
$("bk").onclick=back;$("st").onclick=stat;
$("go").onclick=()=>{tap();$("splash").classList.add("out")};
start();
</script></body></html>
